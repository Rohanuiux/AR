<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
      <a-assets>
        <a-asset-item id="flamingo" src="https://raw.githubusercontent.com/Rohanuiux/AR/main/flamingo.glb"></a-asset-item>
        <a-asset-item id="duck" src="https://raw.githubusercontent.com/Rohanuiux/AR/main/duck.glb"></a-asset-item>
      </a-assets>

      <!-- Marker 1 - Hiro → Flamingo (animated) -->
      <a-marker preset="hiro">
        <a-entity
          gltf-model="#flamingo"
          scale="0.01 0.01 0.01"
          position="0 0 0"
          animation-mixer="clip: *; loop: repeat;"
        ></a-entity>
      </a-marker>

      <!-- Marker 2 - Custom Duck Marker → Duck model -->
      <a-marker type="pattern" url="https://raw.githubusercontent.com/Rohanuiux/AR/main/duckmarker.patt">
        <a-entity
          gltf-model="#duck"
          scale="5.0 5.0 5.0"
          position="0 0 0"
        ></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
